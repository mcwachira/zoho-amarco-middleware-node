openapi: 3.1.0
info:
  title: Zoho Amarco Middleware API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Read-only Zoho Books access and guarded fiscalization preparation/status.
    Receipt issuance and KRA eTIMS reporting remain disabled until external
    contracts and legal sequence are verified.
servers:
  - url: http://127.0.0.1:3000
    description: Local development default; production should use an approved TLS boundary.
tags:
  - name: Health
    description: Public liveness and sanitized readiness diagnostics.
  - name: Zoho Books
    description: Authenticated read and synchronization operations for Zoho Books data.
  - name: Fiscalization
    description: Request registration, device/eTIMS status, reconciliation, and manual review.
  - name: Profiles
    description: Privileged fiscal customer and item configuration.
  - name: OAuth
    description: Public Zoho OAuth authorization and callback routes.
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      tags: [Health]
      summary: Process liveness
      responses:
        "200":
          description: The HTTP process is responding.
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      tags: [Health]
      summary: Database readiness
      responses:
        "200":
          description: Database connection check succeeded.
        "503":
          description: Database is unavailable or not configured.
  /health/dependencies:
    get:
      operationId: getDependencyDiagnostics
      security: []
      tags: [Health]
      summary: Bounded local dependency diagnostics
      responses:
        "200":
          description: Database and configured read-only device status; Zoho and eTIMS report configuration state without live provider operations.
        "400":
          description: The HTTP request could not be parsed by the server.
  /health/integrations:
    get:
      operationId: getIntegrationHealth
      security: []
      tags: [Health]
      summary: Sanitized integration configuration and safety gates
      responses:
        "200":
          description: Reports selected OSCU/VSCU mode, simulation markers, required configuration presence, supported client methods, blockers, and safety gates without credentials or endpoint details. Provider health and protocol verification are explicitly unverified; reconciliation scheduler health includes opt-in/start state and in-process job timestamps/counters.
  /health/device:
    get:
      operationId: getDeviceDiagnostic
      security: []
      tags: [Health]
      summary: Read-only device connectivity diagnostic
      responses:
        "200":
          description: Configured diagnostic endpoint responded; this does not establish receipt readiness.
        "503":
          description: Diagnostic is unavailable, timed out, or did not respond before the configured health deadline.
  /integrations/zoho/authorize:
    get:
      operationId: beginZohoOAuth
      security: []
      tags: [OAuth]
      summary: Begin Zoho OAuth authorization
      responses:
        "302":
          description: Redirect to Zoho consent.
        "503":
          description: OAuth credentials are not configured.
  /integrations/zoho/callback:
    get:
      operationId: completeZohoOAuth
      security: []
      tags: [OAuth]
      summary: Complete Zoho OAuth authorization
      parameters:
        - in: query
          name: code
          schema: { type: string }
          required: true
        - in: query
          name: state
          schema: { type: string }
          required: true
      responses:
        "200":
          description: OAuth tokens were stored encrypted.
        "400":
          description: Callback parameters are invalid or state was rejected.
        "503":
          description: OAuth is unavailable.
  /integrations/zoho/invoices/import:
    post:
      operationId: importZohoInvoices
      tags: [Zoho Books]
      security: [{ bearerAuth: [] }]
      x-required-permission: admin:configure
      summary: Import a paginated Zoho invoice candidate set
      responses:
        "200": { description: Import completed. }
        "207": { description: Import completed with partial results. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks admin:configure. }
        "409": { description: Another synchronization run is active. }
        "502": { description: Zoho request failed. }
        "503": { description: Invoice importing is not configured. }
  /integrations/zoho/invoices/sync/status:
    get:
      operationId: getZohoSyncStatus
      tags: [Zoho Books]
      security: [{ bearerAuth: [] }]
      summary: Read the latest synchronization status
      responses:
        "200": { description: Synchronization status. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Synchronization is not configured. }
  /integrations/zoho/invoices/{invoiceId}:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      operationId: getZohoInvoice
      tags: [Zoho Books]
      security: [{ bearerAuth: [] }]
      summary: Retrieve a Zoho invoice without modifying accounting records
      responses:
        "200": { description: Retrieved invoice response. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks invoice:read. }
        "404":
          {
            description: Zoho Books returned HTTP 404 with documented API error code 1002. Unclassified HTTP 404 responses return 502.,
          }
        "502": { description: "Zoho transport, server, or response error." }
        "503":
          description: "Zoho authorization is missing, the account is rate limited, or retrieval is not configured."
  /integrations/zoho/invoices/{invoiceId}/fiscal-candidate:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      operationId: getFiscalCandidate
      tags: [Zoho Books]
      security: [{ bearerAuth: [] }]
      summary: Map an invoice into a fiscal candidate without issuing a receipt
      responses:
        "200": { description: Candidate mapping. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          {
            description: Zoho Books returned HTTP 404 with documented API error code 1002. Unclassified HTTP 404 responses return 502.,
          }
        "422": { description: Retrieved invoice data failed validation. }
        "502": { description: "Zoho transport, server, or response error." }
        "503":
          description: "Zoho authorization is missing, the account is rate limited, or mapping is not configured."
  /integrations/zoho/invoices/{invoiceId}/tremol-receipt-plan:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      operationId: getTremolReceiptPlan
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      summary: Build a non-executable Tremol receipt-plan proposal
      responses:
        "200": { description: Plan is explicitly non-executable. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: Plan validation failed. }
        "502": { description: Zoho Books request failed. }
        "503": { description: Planning dependencies are unavailable. }
  /integrations/zoho/invoices/{invoiceId}/fiscalization-requests:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      operationId: registerFiscalizationRequest
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: request:create
      summary: Prepare and register an immutable fiscalization request
      responses:
        "201":
          {
            description: A new request was registered with a durable snapshot. The response includes snapshotId for calculation evidence correlation and alreadyExisted=false.,
          }
        "200":
          {
            description: The existing request was returned without refetching or modifying its snapshot; alreadyExisted=true.,
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks request:create. }
        "404":
          {
            description: Zoho Books returned HTTP 404 with documented API error code 1002. Unclassified HTTP 404 responses return 502.,
          }
        "409": { description: A concurrent request was created but could not be retrieved. }
        "422": { description: "Invoice, payment evidence, or fiscal profile validation failed." }
        "502": { description: "Zoho transport, response, authentication, or server error." }
        "503":
          description: "Zoho authorization is unavailable, the account is rate limited, or request persistence/preparation is unavailable."
  /integrations/zoho/fiscalization-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getFiscalizationRequest
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: request:read
      summary: Read fiscalization status and separate device/eTIMS attempt histories
      responses:
        "200":
          {
            description: "Current request, receipt, integration outcomes, and the validated snapshotId digest needed to correlate calculation evidence.",
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks request:read. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Request does not exist. }
        "503": { description: Fiscalization request lookup is not configured. }
  /integrations/zoho/fiscalization-requests:
    get:
      tags: [Fiscalization]
      operationId: listFiscalizationRequests
      security: [{ bearerAuth: [] }]
      x-required-permission: request:read
      summary: List sanitized fiscalization request history
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: status
          schema: { type: string, enum: [Pending, InProgress, Succeeded, Failed, OutcomeUnknown] }
        - in: query
          name: deviceOutcome
          description: Device state is represented by the fiscalization record status in the current domain.
          schema: { type: string, enum: [Pending, InProgress, Succeeded, Failed, OutcomeUnknown] }
        - in: query
          name: createdFrom
          schema: { type: string, format: date-time }
        - in: query
          name: createdTo
          schema: { type: string, format: date-time }
        - in: query
          name: etimsStatus
          schema:
            type: string
            enum:
              [
                not_configured,
                blocked,
                pending,
                in_progress,
                accepted,
                rejected,
                outcome_unknown,
                reconciliation_required,
                reconciling,
              ]
        - in: query
          name: correlationId
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Stable page of sanitized summaries with independent device and eTIMS outcomes.
          content:
            application/json:
              schema:
                type: object
                required: [page, pageSize, total, items]
                properties:
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/FiscalizationHistoryItem" },
                    }
        "400": { description: Invalid filters or pagination. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks request:read. }
        "503": { description: History repository unavailable. }
  /integrations/zoho/operations/metrics:
    get:
      tags: [Health]
      operationId: getOperationalMetrics
      security: [{ bearerAuth: [] }]
      x-required-permission: admin:configure
      summary: Read low-cardinality process metrics and job health
      responses:
        "200": { description: "Metrics without customer, invoice, or operation identifiers." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Operator permission required. }
  /integrations/zoho/fiscalization-requests/{requestId}/manual-review:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Fiscalization]
      operationId: getFiscalizationManualReview
      security: [{ bearerAuth: [] }]
      x-required-permission: manual-review:decide
      summary: Read reconciliation case status and append-only audit history
      responses:
        "200": { description: "Existing case, or null when no case has been opened." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Privileged operator permission required. }
        "503": { description: Manual-review repository unavailable. }
    post:
      tags: [Fiscalization]
      operationId: openManualReviewCase
      security: [{ bearerAuth: [] }]
      x-required-permission: manual-review:decide
      summary: Open an auditable review case for an unresolved operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stage, reason]
              properties:
                stage: { type: string, enum: [device, etims] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Durable review case and related attempt identifiers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualReviewCaseResponse" }
        "400": { description: Invalid review stage or reason. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Privileged operator permission required. }
        "404": { description: Fiscalization request not found. }
        "409": { description: Operation is not in a reviewable unresolved state. }
        "503": { description: Manual-review repository unavailable. }
  /integrations/zoho/manual-review/{caseId}:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Fiscalization]
      operationId: getManualReviewCase
      security: [{ bearerAuth: [] }]
      x-required-permission: manual-review:decide
      summary: Read a durable review case and decision history
      responses:
        "200":
          description: Review state and append-only decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualReviewCaseResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Privileged operator permission required. }
        "404": { description: Review case not found. }
        "503": { description: Manual-review repository unavailable. }
  /integrations/zoho/manual-review:
    get:
      tags: [Fiscalization]
      operationId: listUnresolvedManualReviewCases
      security: [{ bearerAuth: [] }]
      x-required-permission: manual-review:decide
      summary: List unresolved operator reconciliation cases
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Bounded page of unresolved operator cases. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Privileged operator permission required. }
  /integrations/zoho/manual-review/{caseId}/decisions:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Fiscalization]
      operationId: recordManualReviewDecision
      security: [{ bearerAuth: [] }]
      x-required-permission: manual-review:decide
      summary: Record an operator decision without resubmitting an external operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestedOutcome, reason]
              properties:
                requestedOutcome:
                  {
                    type: string,
                    enum:
                      [
                        confirmed_success,
                        confirmed_failure,
                        still_unknown,
                        escalated,
                        investigation_note,
                      ],
                  }
                reason: { type: string, minLength: 1, maxLength: 500 }
                evidenceReference: { type: string, maxLength: 500 }
      responses:
        "200":
          description: "Persisted operator-attested review result; no fiscal outcome is changed and no operation is replayed. Success or failure requires a safe external evidence reference."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualReviewCaseResponse" }
        "400": { description: Invalid decision input. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Privileged operator permission required. }
        "404": { description: Review case not found. }
        "409": { description: Case is already resolved or a concurrent decision won. }
        "503": { description: Manual-review repository unavailable. }
  /integrations/zoho/fiscalization-requests/{requestId}/process:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: processDeviceStage
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: device:operate
      summary: Request a guarded device stage; production configuration is blocked
      responses:
        "200": { description: Persisted device operation result. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks device:operate. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Fiscalization request does not exist. }
        "409": { description: Request is not claimable. }
        "422": { description: Stored fiscalization snapshot is invalid or unsupported. }
        "503":
          description: "Issuance disabled, device not ready, or outcome requires reconciliation."
  /integrations/zoho/fiscalization-requests/{requestId}/execute:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: executeMappedFiscalizationWorkflow
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: device:operate
      summary: Validate and map a persisted request, then run configured guarded stages
      description: "Stage order must be verified or explicitly configured for local simulation. Simulation responses are not KRA/device evidence."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [configuration, context, calculationEvidence]
              properties:
                configuration: { type: object }
                context: { type: object }
                calculationEvidence: { type: object }
      responses:
        "200": { description: All configured stages completed; includes simulated marker. }
        "202": { description: A stage was attempted and the workflow remains blocked for review. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks device:operate. }
        "404": { description: Fiscalization request does not exist. }
        "409":
          description: >-
            Workflow sequence/preflight is blocked, the request is not claimable,
            or a different mapping configuration is already archived.
        "422": { description: Invoice mapping failed validation. }
        "503": { description: Workflow service is unavailable. }
  /integrations/zoho/fiscalization-requests/{requestId}/zoho-writeback:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getZohoFiscalizationWritebackStatus
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: request:read
      summary: Retrieve persisted Zoho fiscalization writeback status
      responses:
        "200":
          description: Writeback state and safe correlation metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoFiscalizationWritebackResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks request:read. }
        "503": { description: Writeback is not configured. }
    post:
      operationId: writeZohoFiscalizationOutcome
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: invoice:writeback
      summary: Write an eligible persisted fiscalization result to configured Zoho invoice custom fields
      description: >-
        Accepts no caller-supplied receipt/status values. Only a persisted complete,
        authoritative real device success and accepted non-simulated eTIMS result
        are eligible. Unknown remote update outcomes are reconciled by reading the
        invoice and are never blindly resent. This operation does not run fiscalization.
      responses:
        "200":
          description: "Writeback succeeded, failed definitively, or requires manual review."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoFiscalizationWritebackResult" }
        "202":
          description: Another writeback operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoFiscalizationWritebackResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks invoice:writeback. }
        "404": { description: Fiscalization request does not exist. }
        "409": { description: Persisted fiscalization outcome is not eligible. }
        "503": { description: Writeback is not configured or unavailable. }
  /integrations/zoho/fiscalization-requests/{requestId}/etims/reconcile:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: reconcileEtimsOperation
      tags: [Fiscalization]
      security: [{ bearerAuth: [] }]
      x-required-permission: etims:reconcile
      summary: Reconcile an uncertain eTIMS operation without resubmitting it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  description: Must reproduce the immutable payload registered for this operation.
      responses:
        "200": { description: Persisted reconciliation result and sanitized attempt history. }
        "400": { description: Invalid request or missing payload. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks etims:reconcile. }
        "404": { description: Fiscalization request does not exist. }
        "409": { description: No eTIMS operation exists or it cannot be reconciled. }
        "422": { description: Payload does not match the operation hash. }
        "503": { description: Reconciliation is not configured. }
  /integrations/zoho/fiscal-customer-profiles:
    post:
      operationId: createFiscalCustomerProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      x-required-permission: profile:manage
      summary: Create a fiscal customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FiscalCustomerProfileInput" }
      responses:
        "201": { description: Profile created. }
        "400": { description: Profile validation failed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks profile:manage. }
        "409": { description: A profile already exists for the Zoho customer. }
        "500": { description: Unexpected persistence error. }
        "503": { description: Fiscal profile repository is unavailable. }
  /integrations/zoho/fiscal-customer-profiles/{zohoCustomerId}:
    parameters:
      - name: zohoCustomerId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFiscalCustomerProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      x-required-permission: profile:manage
      summary: Retrieve a fiscal customer profile
      responses:
        "200": { description: Profile. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks profile:manage. }
        "404": { description: Profile not found. }
        "500": { description: Unexpected persistence error. }
        "503": { description: Fiscal profile repository is unavailable. }
    put:
      operationId: updateFiscalCustomerProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      x-required-permission: profile:manage
      summary: Update a fiscal customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FiscalCustomerProfileUpdate" }
      responses:
        "200": { description: Updated profile. }
        "400": { description: Profile validation failed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks profile:manage. }
        "404": { description: Profile not found. }
        "500": { description: Unexpected persistence error. }
        "503": { description: Fiscal profile repository is unavailable. }
    delete:
      operationId: deleteFiscalCustomerProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      x-required-permission: profile:manage
      summary: Delete a fiscal customer profile
      responses:
        "204": { description: Profile deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks profile:manage. }
        "404": { description: Profile not found. }
        "500": { description: Unexpected persistence error. }
        "503": { description: Fiscal profile repository is unavailable. }
  /integrations/zoho/fiscal-item-profiles:
    post:
      operationId: createFiscalItemProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      x-required-permission: profile:manage
      summary: Create a fiscal item profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FiscalItemProfileInput" }
      responses:
        "201": { description: Profile created. }
        "400": { description: Profile validation failed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks profile:manage. }
        "409": { description: A profile already exists for the Zoho item. }
        "500": { description: Unexpected persistence error. }
        "503": { description: Fiscal profile repository is unavailable. }
  /integrations/zoho/fiscal-item-profiles/{zohoItemId}:
    parameters:
      - name: zohoItemId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFiscalItemProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
      x-required-permission: profile:manage
      summary: Retrieve a fiscal item profile
      responses:
        "200": { description: Profile. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Authenticated identity lacks profile:manage. }
        "404": { description: Profile not found. }
        "500": { description: Unexpected persistence error. }
        "503": { description: Fiscal profile repository is unavailable. }
    put:
      operationId: updateFiscalItemProfile
      tags: [Profiles]
      security: [{ bearerAuth: [] }]
