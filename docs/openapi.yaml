components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Use INVOICE_API_BEARER_TOKEN for invoice/request read and request
        registration. Privileged routes require the distinct
        OPERATOR_API_BEARER_TOKEN. Role headers are not trusted.
  schemas:
    FiscalCustomerProfileInput:
      type: object
      additionalProperties: false
      required:
        [
          zohoCustomerId,
          companyName,
          clientPin,
          headquarters,
          address,
          postalCodeAndCity,
          exemptionNumber,
        ]
      properties:
        zohoCustomerId: { type: string }
        companyName: { type: string }
        clientPin: { type: string }
        headquarters: { type: string }
        address: { type: string }
        postalCodeAndCity: { type: string }
        exemptionNumber: { type: [string, "null"] }
    FiscalCustomerProfileUpdate:
      type: object
      additionalProperties: false
      required: [companyName, clientPin, headquarters, address, postalCodeAndCity, exemptionNumber]
      properties:
        companyName: { type: string }
        clientPin: { type: string }
        headquarters: { type: string }
        address: { type: string }
        postalCodeAndCity: { type: string }
        exemptionNumber: { type: [string, "null"] }
    FiscalItemProfileInput:
      type: object
      additionalProperties: false
      required: [zohoItemId, measureUnit, hsCode, hsName, vatClass, vatGroupRate]
      properties:
        zohoItemId: { type: string }
        measureUnit: { type: string }
        hsCode: { type: string }
        hsName: { type: string }
        vatClass: { type: string }
        vatGroupRate: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
    FiscalItemProfileUpdate:
      type: object
      additionalProperties: false
      required: [measureUnit, hsCode, hsName, vatClass, vatGroupRate]
      properties:
        measureUnit: { type: string }
        hsCode: { type: string }
        hsName: { type: string }
        vatClass: { type: string }
        vatGroupRate: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
    FiscalizationHistoryItem:
      type: object
      required:
        [
          id,
          zohoInvoiceId,
          status,
          deviceOutcome,
          etimsOutcome,
          createdAt,
          updatedAt,
          deviceAttempts,
        ]
      properties:
        id: { type: string }
        zohoInvoiceId: { type: string }
        status: { type: string }
        deviceOutcome: { type: string }
        etimsOutcome: { type: string }
        correlationId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        failureCode: { type: [string, "null"] }
        deviceAttempts:
          type: array
          items:
            type: object
            required: [attemptNumber, outcome, errorCode]
            properties:
              attemptNumber: { type: integer }
              outcome: { type: [string, "null"] }
              errorCode: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    ManualReviewCaseResponse:
      type: object
      required: [reviewCase]
      properties:
        reviewCase:
          type: object
          required:
            [
              id,
              fiscalizationRequestId,
              operationId,
              relatedAttemptIds,
              observedState,
              reason,
              initiatingOperatorSubject,
              resolvingOperatorSubject,
              resolvedAt,
              status,
              createdAt,
              updatedAt,
              decisions,
            ]
          properties:
            id: { type: string }
            fiscalizationRequestId: { type: string }
            operationId: { type: string }
            relatedAttemptIds: { type: array, items: { type: string } }
            observedState: { type: string }
            reason: { type: string }
            initiatingOperatorSubject: { type: string }
            resolvingOperatorSubject: { type: [string, "null"] }
            resolvedAt: { type: [string, "null"], format: date-time }
            status: { type: string, enum: [open, resolved] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            decisions:
              type: array
              items:
                type: object
                required:
                  [
                    id,
                    caseId,
                    sequence,
                    operatorSubject,
                    requestedOutcome,
                    resolution,
                    reason,
                    evidenceReference,
                    recordedAt,
                  ]
                properties:
                  id: { type: string }
                  caseId: { type: string }
                  sequence: { type: integer }
                  operatorSubject: { type: string }
                  requestedOutcome:
                    { type: string, enum: [confirmed_success, confirmed_failure, still_unknown] }
                  resolution: { type: string, enum: [confirmed, still_unknown, invalid_evidence] }
                  reason: { type: string }
                  evidenceReference: { type: [string, "null"] }
                  recordedAt: { type: string, format: date-time }
    ZohoFiscalizationWritebackResult:
      type: object
      required: [status, requestId]
      properties:
        status:
          type: string
          enum: [not_eligible, in_progress, succeeded, failed, outcome_unknown, manual_review]
        requestId: { type: string }
        reason: { type: string }
        correlationId: { type: string }
        fieldsWritten: { type: integer, minimum: 0 }
        errorCategory: { type: [string, "null"] }
  parameters:
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Request fields are invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Bearer token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
