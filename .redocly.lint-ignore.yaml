# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# Narrow exceptions: public health routes intentionally return only their documented
# operational statuses; OAuth authorize intentionally returns a 302 redirect (or 503).
# These operations do not have artificial 2xx/4xx responses added to satisfy style rules.
docs/openapi.yaml:
  operation-4xx-response:
    - "#/paths/~1health~1live/get/responses"
    - "#/paths/~1health~1ready/get/responses"
    - "#/paths/~1health~1integrations/get/responses"
    - "#/paths/~1health~1device/get/responses"
    - "#/paths/~1integrations~1zoho~1authorize/get/responses"
  operation-2xx-response:
    - "#/paths/~1integrations~1zoho~1authorize/get/responses"
