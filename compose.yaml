services:
  postgres:
    image: postgres:18
    container_name: zoho-amarco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - zoho_amarco_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zoho_amarco_postgres_data:
